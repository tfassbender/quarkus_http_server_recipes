<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-sidebar: #2c2c2c;
      --bg-hover: #3a3a3a;
      --bg-accent: #007acc;
      --text-main: #e0e0e0;
      --text-muted: #bbbbbb;
      --border-color: #444;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: row;
      height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    #sidebar {
      width: 20%;
      min-width: 200px;
      background-color: var(--bg-sidebar);
      padding: 1em;
      overflow-y: auto;
      border-right: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    #content {
      flex: 1;
      padding: 2em;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.8em;
      margin-top: 0;
      color: var(--text-main);
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5em;
      margin-bottom: 0.5em;
    }

    #sidebar-header h1 {
      margin: 0;
    }

    .header-buttons {
      display: flex;
      gap: 0.25em;
    }

    .icon-button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 4px;
      width: 2em;
      height: 2em;
      cursor: pointer;
      font-size: 1em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .icon-button:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    #show-sidebar {
      position: fixed;
      top: 0.8em;
      left: 0.8em;
      z-index: 10;
      display: none;
    }

    body.sidebar-hidden #sidebar {
      display: none;
    }

    body.sidebar-hidden #show-sidebar {
      display: inline-flex;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 0.5em;
    }

    a {
      display: block;
      padding: 0.6em 0.8em;
      border-radius: 4px;
      text-decoration: none;
      color: var(--text-main);
      background-color: transparent;
      transition: background 0.2s;
      font-size: 1em;
      font-weight: bold;
    }

    a:hover {
      background-color: var(--bg-hover);
    }

    a.active {
      background-color: var(--bg-accent);
      color: #ffffff;
    }

    #recipe-content {
      background: #111;
      padding: 1em;
      border-radius: 4px;
      white-space: pre-wrap;
      font-size: 1.2em;
      color: var(--text-muted);

      table {
        border-collapse: collapse;
      }

      thead {
        display: none;
      }

      tr:not(:last-child) td {
        border-bottom: 1px solid;
      }

      td {
        padding: 5px;
      }

      td:nth-child(2) {
        padding-left: 30px;
      }

      p {
        margin-top: 5px;
        margin-bottom: 5px;
      }
    }

    #search-wrapper {
      position: relative;
      margin-bottom: 1em;
    }

    #search {
      width: 100%;
      padding: 0.6em 2.2em 0.6em 0.6em;
      font-size: 1em;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: #1a1a1a;
      color: var(--text-main);
    }

    #clear-search {
      position: absolute;
      top: 50%;
      right: 0.4em;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1em;
      padding: 0.2em 0.4em;
      display: none;
    }

    #clear-search:hover {
      color: var(--text-main);
    }

    #search-wrapper.has-value #clear-search {
      display: inline-block;
    }

    .tag-group {
      margin-bottom: 0.5em;
    }

    .tag-group > summary {
      cursor: pointer;
      padding: 0.6em 0.8em;
      font-weight: bold;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.05em;
      border-radius: 4px;
    }

    .tag-group > summary:hover {
      color: var(--text-main);
    }

    .tag-group ul {
      margin-left: 0.5em;
      padding-left: 1em;
    }

    .recipe-item {
      display: flex;
      align-items: center;
      gap: 0.25em;
    }

    .recipe-item a {
      flex: 1;
      min-width: 0;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1em;
      padding: 0.2em 0.4em;
      line-height: 1;
    }

    .fav-btn:hover {
      color: var(--text-main);
    }

    .fav-btn.is-favorite {
      color: #f5c542;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        min-width: 0;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      #content {
        padding: 1em;
      }

      a {
        font-size: 1.1em;
        padding: 0.8em;
      }

      pre {
        font-size: 1em;
      }

      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>

<button id="show-sidebar" class="icon-button" title="Seitenleiste anzeigen" aria-label="Seitenleiste anzeigen">&#9776;</button>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Rezepte</h1>
    <div class="header-buttons">
      <button id="expand-all" class="icon-button" title="Alle ausklappen" aria-label="Alle ausklappen">&#43;</button>
      <button id="collapse-all" class="icon-button" title="Alle einklappen" aria-label="Alle einklappen">&#8722;</button>
      <button id="hide-sidebar" class="icon-button" title="Seitenleiste ausblenden" aria-label="Seitenleiste ausblenden">&times;</button>
    </div>
  </div>
  <div id="search-wrapper">
    <input type="text" id="search" placeholder="Rezepte suchen..." />
    <button id="clear-search" type="button" title="Suche leeren" aria-label="Suche leeren">&times;</button>
  </div>
  <div id="recipe-list">Loading...</div>
</div>

<div id="content">
  <div id="recipe-content">Wähle ein Rezept aus der Liste aus um es anzuzeigen.</div>
</div>

<script>
  const UNTAGGED = 'Andere';
  const FAVORITES = 'Favoriten';
  const FAVORITES_KEY = 'recipes:favorites';
  const HASH_PREFIX = '#/recipe/';
  let allRecipes = [];
  let currentRecipe = null;
  let favorites = loadFavorites();

  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAVORITES_KEY);
      if (!raw) return new Set();
      const arr = JSON.parse(raw);
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
      return new Set();
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
    } catch (e) {
      console.error('Failed to save favorites', e);
    }
  }

  function toggleFavorite(name) {
    if (favorites.has(name)) favorites.delete(name);
    else favorites.add(name);
    saveFavorites();
    renderRecipeList(filterRecipes(document.getElementById('search').value));
  }

  function loadRecipeList() {
    fetch('/recipes')
      .then(response => response.json())
      .then(data => {
        allRecipes = data;
        renderRecipeList(data);
        const fromHash = recipeFromHash();
        if (fromHash) selectRecipe(fromHash, false);
      })
      .catch(error => {
        document.getElementById('recipe-list').textContent = 'Error loading recipes.';
        console.error(error);
      });
  }

  function recipeFromHash() {
    const hash = window.location.hash || '';
    if (!hash.startsWith(HASH_PREFIX)) return null;
    try {
      return decodeURIComponent(hash.substring(HASH_PREFIX.length));
    } catch (e) {
      return null;
    }
  }

  function selectRecipe(name, updateHash) {
    currentRecipe = name;
    loadRecipe(name);
    document.querySelectorAll('#recipe-list a').forEach(a => {
      a.classList.toggle('active', a.textContent === name);
    });
    if (updateHash) {
      const target = HASH_PREFIX + encodeURIComponent(name);
      if (window.location.hash !== target) {
        window.location.hash = target;
      }
    }
  }

  function groupByTag(recipes) {
    const groups = new Map();
    recipes.forEach(r => {
      const tags = r.tags && r.tags.length ? r.tags : [UNTAGGED];
      tags.forEach(tag => {
        if (!groups.has(tag)) groups.set(tag, []);
        groups.get(tag).push(r);
      });
    });
    return [...groups.entries()].sort(([a], [b]) => {
      if (a === UNTAGGED) return 1;
      if (b === UNTAGGED) return -1;
      return a.localeCompare(b);
    });
  }

  function renderRecipeList(recipes) {
    const list = document.getElementById('recipe-list');
    const openGroups = new Set();
    list.querySelectorAll('details.tag-group').forEach(d => {
      if (d.open && d.dataset.label) openGroups.add(d.dataset.label);
    });
    list.innerHTML = '';
    const favs = recipes.filter(r => favorites.has(r.name));
    if (favs.length > 0) {
      list.appendChild(renderGroup(FAVORITES, favs, openGroups));
    }
    groupByTag(recipes).forEach(([tag, items]) => {
      list.appendChild(renderGroup(tag, items, openGroups));
    });
  }

  function renderGroup(label, items, openGroups) {
    const group = document.createElement('details');
    group.className = 'tag-group';
    group.dataset.label = label;
    if (openGroups && openGroups.has(label)) group.open = true;
    const summary = document.createElement('summary');
    summary.textContent = `${label} (${items.length})`;
    group.appendChild(summary);
    const ul = document.createElement('ul');
    items.forEach(r => ul.appendChild(renderRecipeItem(r)));
    group.appendChild(ul);
    return group;
  }

  function renderRecipeItem(recipe) {
    const item = document.createElement('li');
    const wrapper = document.createElement('div');
    wrapper.className = 'recipe-item';
    const link = document.createElement('a');
    link.textContent = recipe.name;
    link.classList.toggle('active', recipe.name === currentRecipe);
    link.onclick = () => {
      selectRecipe(recipe.name, true);
    };
    const fav = document.createElement('button');
    fav.type = 'button';
    fav.className = 'fav-btn';
    const isFav = favorites.has(recipe.name);
    fav.classList.toggle('is-favorite', isFav);
    fav.textContent = isFav ? '★' : '☆';
    fav.title = isFav ? 'Favorit entfernen' : 'Als Favorit markieren';
    fav.setAttribute('aria-label', fav.title);
    fav.onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(recipe.name);
    };
    wrapper.appendChild(link);
    wrapper.appendChild(fav);
    item.appendChild(wrapper);
    return item;
  }

  function loadRecipe(filename) {
    fetch(`/recipes/${encodeURIComponent(filename)}`)
      .then(response => {
        if (!response.ok) throw new Error("Not found");
        return response.text();
      })
      .then(html => {
        document.getElementById('recipe-content').innerHTML = html;
      })
      .catch(error => {
        document.getElementById('recipe-content').textContent = 'Failed to load recipe.';
        console.error(error);
      });
  }

  function filterRecipes(rawQuery) {
    const query = (rawQuery || '').trim().toLowerCase();
    if (!query) return allRecipes;
    const tokens = query.split(/\s+/);
    return allRecipes.filter(r => {
      const haystackName = r.name.toLowerCase();
      const tagsLower = (r.tags || []).map(t => t.toLowerCase());
      return tokens.every(tok => {
        if (tok.startsWith('#')) {
          const t = tok.substring(1);
          return tagsLower.some(tag => tag === t);
        }
        return haystackName.includes(tok) || tagsLower.some(tag => tag.includes(tok));
      });
    });
  }

  function setupSearch() {
    const searchInput = document.getElementById('search');
    const wrapper = document.getElementById('search-wrapper');
    const clearBtn = document.getElementById('clear-search');
    const update = () => {
      wrapper.classList.toggle('has-value', searchInput.value.length > 0);
      renderRecipeList(filterRecipes(searchInput.value));
    };
    searchInput.addEventListener('input', update);
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      update();
      searchInput.focus();
    });
  }

  function setupHeaderButtons() {
    document.getElementById('expand-all').onclick = () => {
      document.querySelectorAll('#recipe-list details').forEach(d => d.open = true);
    };
    document.getElementById('collapse-all').onclick = () => {
      document.querySelectorAll('#recipe-list details').forEach(d => d.open = false);
    };
    document.getElementById('hide-sidebar').onclick = () => {
      document.body.classList.add('sidebar-hidden');
    };
    document.getElementById('show-sidebar').onclick = () => {
      document.body.classList.remove('sidebar-hidden');
    };
  }

  window.addEventListener('hashchange', () => {
    const name = recipeFromHash();
    if (name && name !== currentRecipe) selectRecipe(name, false);
  });

  loadRecipeList();
  setupSearch();
  setupHeaderButtons();
</script>

</body>
</html>
