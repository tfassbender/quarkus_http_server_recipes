quarkus.http.port=4711

# The recipe properties below should be overridden in an external config file beneath the jar file:
# .../build/quarkus-app/
#     quarkus-run.jar
#     config/
#         application.properties

# Directory with the recipe .txt files. With a git remote configured, the repository is cloned into it
# (the directory must then be empty or not exist yet).
recipes.path=C:/Users/Tobia/Desktop/tmp/recipes

# Optional git repository to sync the recipes from. Without it, recipes.path is used as a plain directory.
#recipes.git.remote=https://github.com/<user>/<recipes-repo>.git
# Optional branch (defaults to the remote's default branch)
#recipes.git.branch=main
# Optional credentials for private HTTPS repositories (e.g. a personal access token)
#recipes.git.username=<user>
#recipes.git.token=<token>

# How often to pull from the remote and re-read the recipe files
recipes.sync.interval=5m
# Minimum time between two manual pulls (shared across all users)
recipes.sync.manual-cooldown=60s

%test.recipes.path=src/test/resources/recipes
%test.recipes.sync.interval=1h
